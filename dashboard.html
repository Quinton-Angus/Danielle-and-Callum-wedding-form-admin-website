<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Guest information form</title>
        <link rel="styleSheet" href="./style.css">
    </head>

    <body>
        <header>
            <div id="headerDesktop">
                <img src="./assets/QDS logo red.svg">
                <a href="https://admin.danielle-and-callum.quintondev.com"><div class="headerLink">Admin portal</div></a>
                <a href="https://form.danielle-and-callum.quintondev.com"><div class="headerLink">Information form</div></a>
                <a href="https://admin.danielle-and-callum.quintondev.com/login"><div class="headerLinkActive">Login</div></a>
                <a href="mailto:support@quintondev.com"><div class="headerLink">Support</div></a>
            </div>
            <div id="headerMobileWrapper">
                <div class="headerMobileDeactivated" id="headerMobile">
                    <div id="headerMobileHamburgerClose"></div>
                    <a href="https://admin.danielle-and-callum.quintondev.com"><div class="headerLink ">Admin portal</div></a>
                    <a href="https://form.danielle-and-callum.quintondev.com"><div class="headerLinkActive " >Information form</div></a>
                    <a href="https://admin.danielle-and-callum.quintondev.com/login"><div class="headerLink ">Login</div></a>
                    <a href="mailto:support@quintondev.com"><div class="headerLink ">Support</div></a>           
                </div>

                <div id="headerMobileHamburger"></div>
            </div>
        </header>
        <div class="content">
            <div id="dashboard">
                <div id="title">Admin login</div>
                <div class="input">
                    <div class="inputTitle">Email</div>
                    <input type="text" id="emailInput">
                </div>
                <div class="input">
                    <div class="inputTitle">Password</div>
                    <input type="password" id="passwordInput">
                </div>
                <div id="error"></div>
                <div id="submitBtn">
                    <div id="submitTxt">Login ></div>
                    <div id="submitSpinner"></div>
                </div>
            </div>
        </div>
        <footer>
            <div id="footerBranding">
                <img src="./assets/QDS_full_logo.svg" id="footerLogo">
                <div id="footerBrandDivider"></div>
                <div class="footerBrandDetail">Web: <span class="footerBrandDetailReg">www.quintondev.com</span></div>
                <div class="footerBrandDetail">Email: <span class="footerBrandDetailReg">support@quintondev.com</span></div>
                <div id="copyright">© Quinton Dev Studios 2026. All rights reserved</div>
            </div>
            <div id="footerVerticalDivider"></div>
            <div id="footerMobileDivider"></div>
        </footer>
        <script src="./login.js"></script>
    </body>

</html>
